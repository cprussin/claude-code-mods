<title>Status Summary</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a control-room board. Summary strip on top, then "Needs you" beside "Sessions"; stacks to one column on phones. */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --line: #dde2e8;
  --fg: #17202a;
  --muted: #5d6b7a;
  --accent: #0f6e78;
  --accent-ink: #ffffff;
  --waiting: #b35a00;
  --waiting-bg: #fff1e0;
  --running: #1d5fc4;
  --running-bg: #e6efff;
  --review: #6a3fb5;
  --review-bg: #f0e9ff;
  --failed: #b42323;
  --failed-bg: #ffe8e8;
  --done: #4b6b55;
  --done-bg: #e7f2ea;
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --panel: #161d23; --line: #26313b; --fg: #e4e9ee; --muted: #93a2b1;
    --accent: #4fb8c2; --accent-ink: #061417;
    --waiting: #ffaf5c; --waiting-bg: #3a2610; --running: #7fb0ff; --running-bg: #14243f;
    --review: #c3a2ff; --review-bg: #2a1f42; --failed: #ff8a8a; --failed-bg: #3d1717;
    --done: #8fc19d; --done-bg: #17291d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #161d23; --line: #26313b; --fg: #e4e9ee; --muted: #93a2b1;
  --accent: #4fb8c2; --accent-ink: #061417;
  --waiting: #ffaf5c; --waiting-bg: #3a2610; --running: #7fb0ff; --running-bg: #14243f;
  --review: #c3a2ff; --review-bg: #2a1f42; --failed: #ff8a8a; --failed-bg: #3d1717;
  --done: #8fc19d; --done-bg: #17291d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font: 700 1.6rem/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; }
h2 { font: 700 1.05rem/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font: 12px var(--font-mono); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button { font: 500 13px var(--font-body); border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 2px 6px; }
button.ghost:hover { color: var(--fg); border-color: var(--line); }
.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.chip b { font-weight: 600; }
.s-waiting { color: var(--waiting); background: var(--waiting-bg); }
.s-running { color: var(--running); background: var(--running-bg); }
.s-review { color: var(--review); background: var(--review-bg); }
.s-failed { color: var(--failed); background: var(--failed-bg); }
.s-done { color: var(--done); background: var(--done-bg); }
.grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.count { font: 500 12px var(--font-mono); color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
ul > .item:first-child { border-top: 0; }
.item .text { min-width: 0; overflow-wrap: anywhere; }
.item .sub { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.item .sub a { color: inherit; }
.ask { border-left: 3px solid var(--waiting); padding-left: 10px; }
.ask .from { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--waiting); }
.done-text { text-decoration: line-through; color: var(--muted); }
input[type="checkbox"] { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--accent); }
form.add { display: flex; gap: 8px; }
form.add input { flex: 1; min-width: 0; font: 14px var(--font-body); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.group { display: grid; gap: 4px; }
.group-label { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-top: 4px; }
.session { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.group .session:first-of-type { border-top: 0; }
.session a.title { color: var(--fg); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.session a.title:hover { color: var(--accent); text-decoration: underline; }
.session .detail { grid-column: 1 / -1; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.session .facts { grid-column: 1 / -1; font: 12px var(--font-mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.pill { font: 500 11px var(--font-mono); padding: 1px 8px; border-radius: 999px; align-self: start; white-space: nowrap; }
.unread { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: middle; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
.notice { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--waiting-bg); color: var(--fg); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: no-preference) { .item, .session { transition: background-color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>Status Summary</h1>
    <div class="meta"><span id="updated">Loading sessions…</span><button id="refresh" type="button">Refresh</button></div>
  </header>
  <div class="strip" id="strip"></div>
  <div class="grid">
    <section aria-labelledby="todo-h" class="panel" id="todo-panel">
      <div class="panel-head"><h2 id="todo-h">Needs you</h2><span class="count" id="todo-count"></span></div>
      <div hidden id="todo-notice"></div>
      <ul aria-label="Asks from sessions" id="asks"></ul>
      <ul aria-label="Your TODOs" id="todos"></ul>
      <form class="add" id="add-form">
        <input aria-label="New TODO" autocomplete="off" id="add-input" placeholder="Add a TODO…" type="text">
        <button class="primary" type="submit">Add</button>
      </form>
      <details hidden id="done-wrap"><summary id="done-summary"></summary><ul id="done-list"></ul></details>
    </section>
    <section aria-labelledby="sessions-h" class="panel" id="sessions-panel">
      <div class="panel-head"><h2 id="sessions-h">Sessions</h2><span class="count" id="session-count"></span></div>
      <div hidden id="session-notice"></div>
      <div id="sessions"><p class="empty">Waiting for the Claude Code Remote connector. Your active sessions appear here, grouped by state.</p></div>
    </section>
  </div>
</div>

<script src="page.js"></script>
